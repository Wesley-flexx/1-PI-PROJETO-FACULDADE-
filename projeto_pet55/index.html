<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Pet55</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e6ebee;
            font-family: Arial, sans-serif;
        }
        .container-produtos {
            max-width: 1200px;
            margin: 40px auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            border: 2px solid #333333;
        }
        .header {
            background-color: #38559D;
            color: white;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header img {
            height: 60px;
        }
        .titulo {
            padding-top: 10px;
            text-align: center;
            font-size: 30px;
            color: #333333;
        }
        .produto-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .produto-item:last-child {
            border-bottom: none;
        }
        .acoes {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-adicionar {
            background-color: #38559D;
            color: white;
        }
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-bar input {
            flex: 1;
        }
        .itens-info {
            font-size: 14px;
            color: #F4B064;
        }
        .btn-primary {
            background-color: #38559D;
            border: none;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            color: #333333;
        }
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 5px;
            color: white;
            animation: slideIn 0.5s forwards;
        }
        .notification.info {
            background-color: #38559D;
        }
        .notification.success {
            background-color: #28a745;
        }
        .notification.warning {
            background-color: #ffc107;
        }
        .notification.error {
            background-color: #dc3545;
        }
        .notification.fade-out {
            animation: fadeOut 0.5s forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .btn-close-notification {
            background: none;
            border: none;
            color: white;
            margin-left: 10px;
            cursor: pointer;
        }
        .badge-estoque-baixo {
            background-color: #dc3545 !important;
        }
    </style>
</head>
<body>
    <!-- Spinner de carregamento -->
    <div class="loading-spinner spinner-border text-primary" role="status">
        <span class="visually-hidden">Carregando...</span>
    </div>

    <div class="container">
        <div class="header">
            <div class="d-flex align-items-center">
                <img src="img/logo-pet55.png" alt="Logo Pet55" width="100">
            </div>
            <div>
                <span class="itens-info">📦 <span id="contadorItens">0</span> itens cadastrados | 
                <span id="totalEstoque">0</span> unidades no total</span>
            </div>
        </div>
        <h2 class="titulo">Produtos</h2>
        <div class="container-produtos" id="containerProdutos">
            <!-- Conteúdo dinâmico será inserido aqui pelo JavaScript -->
        </div>
        <div class="footer">
            © Sistema de Controle de Estoque - Pet55
        </div>
    </div>

    <!-- Modal para adicionar/editar produtos -->
    <div class="modal fade" id="produtoModal" tabindex="-1" aria-labelledby="produtoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="produtoModalLabel">Cadastro de Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProduto">
                        <div class="mb-3">
                            <label for="inputDescricao" class="form-label">Descrição do Produto*</label>
                            <input type="text" class="form-control" id="inputDescricao" required minlength="3">
                            <div class="invalid-feedback">Por favor, insira uma descrição com pelo menos 3 caracteres</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputQuantidade" class="form-label">Quantidade*</label>
                            <input type="number" class="form-control" id="inputQuantidade" min="0" required>
                            <div class="invalid-feedback">Por favor, insira uma quantidade válida (não negativa)</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvar">
                        <span id="btnSalvarTexto">Salvar</span>
                        <span id="btnSalvarSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        // Importação dos módulos do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
        import { 
            getFirestore, collection, doc, 
            addDoc, updateDoc, deleteDoc, 
            onSnapshot, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCKHcPrnCbWlsjPe3EID9HBg4WkPePeKQA",
            authDomain: "estoque-pet55.firebaseapp.com",
            projectId: "estoque-pet55",
            storageBucket: "estoque-pet55.firebasestorage.app",
            messagingSenderId: "953682963174",
            appId: "1:953682963174:web:0cebf135512a4a4c00e927"
        };

        // Inicialização do Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const produtosCollection = collection(db, "produtos");

        // Variáveis globais
        let produtos = [];
        let produtoEditando = null;
        let edicoesPendentes = new Set();
        let ultimaRenderizacao = 0;

        // Elementos DOM
        const modal = new bootstrap.Modal('#produtoModal');
        const formProduto = document.getElementById('formProduto');
        const inputDescricao = document.getElementById('inputDescricao');
        const inputQuantidade = document.getElementById('inputQuantidade');
        const btnSalvar = document.getElementById('btnSalvar');
        const btnSalvarTexto = document.getElementById('btnSalvarTexto');
        const btnSalvarSpinner = document.getElementById('btnSalvarSpinner');
        const containerProdutos = document.getElementById('containerProdutos');
        const contadorItens = document.getElementById('contadorItens');
        const totalEstoqueElement = document.getElementById('totalEstoque');
        const loadingSpinner = document.querySelector('.loading-spinner');

        // Função para mostrar notificação
        function notificar(mensagem, tipo = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${tipo}`;
            notification.innerHTML = `
                <span>${mensagem}</span>
                <button class="btn-close-notification">×</button>
            `;
            
            document.body.appendChild(notification);
            
            // Remove após 5 segundos
            setTimeout(() => {
                notification.classList.add('fade-out');
                setTimeout(() => notification.remove(), 500);
            }, 5000);
            
            // Fechar manualmente
            notification.querySelector('.btn-close-notification').addEventListener('click', () => {
                notification.remove();
            });
        }

        // Função para mostrar/ocultar loading
        function toggleLoading(show) {
            if (show) {
                loadingSpinner.style.display = 'block';
            } else {
                loadingSpinner.style.display = 'none';
            }
        }

        // Validação de formulário
        function validarFormulario() {
            let valido = true;
            
            // Valida descrição
            if (inputDescricao.value.trim().length < 3) {
                inputDescricao.classList.add('is-invalid');
                valido = false;
            } else {
                inputDescricao.classList.remove('is-invalid');
            }
            
            // Valida quantidade
            if (isNaN(inputQuantidade.value) || parseInt(inputQuantidade.value) < 0) {
                inputQuantidade.classList.add('is-invalid');
                valido = false;
            } else {
                inputQuantidade.classList.remove('is-invalid');
            }
            
            return valido;
        }

        // Monitoramento em tempo real
        function iniciarMonitoramento() {
            toggleLoading(true);
            onSnapshot(produtosCollection, (snapshot) => {
                produtos = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderizarProdutos();
                atualizarEstatisticas();
                toggleLoading(false);
            }, (error) => {
                console.error("Erro na conexão:", error);
                toggleLoading(false);
                notificar("Erro ao carregar produtos. Recarregue a página.", "error");
            });
        }

        // Atualiza estatísticas
        function atualizarEstatisticas() {
            contadorItens.textContent = produtos.length;
            const totalEstoque = produtos.reduce((sum, p) => sum + (p.quantidade || 0), 0);
            totalEstoqueElement.textContent = totalEstoque;
        }

        // Renderização otimizada dos produtos
        function renderizarProdutos(produtosParaRenderizar = produtos) {
            const agora = Date.now();
            if (agora - ultimaRenderizacao < 300) return; // Throttle de 300ms
            ultimaRenderizacao = agora;

            containerProdutos.innerHTML = `
                <div class="search-bar mb-3">
                    <input type="text" id="inputBusca" class="form-control" placeholder="Buscar produtos..." 
                           aria-label="Buscar produtos">
                    <button id="btnBusca" class="btn btn-outline-secondary" aria-label="Buscar">🔍</button>
                    <button class="btn btn-adicionar" data-bs-toggle="modal" data-bs-target="#produtoModal"
                            aria-label="Adicionar produto">
                        + Adicionar
                    </button>
                    <select id="filtroEstoque" class="form-select" style="width: auto;">
                        <option value="todos">Todos</option>
                        <option value="estoque-baixo">Estoque baixo (<5)</option>
                        <option value="recentes">Recentes</option>
                    </select>
                </div>
            `;

            if (produtosParaRenderizar.length === 0) {
                containerProdutos.innerHTML += `
                    <div class="alert alert-info text-center">
                        Nenhum produto encontrado. Tente ajustar sua busca ou adicionar um novo produto.
                    </div>
                `;
            } else {
                produtosParaRenderizar.forEach(produto => {
                    const produtoElement = document.createElement('div');
                    produtoElement.className = 'produto-item';
                    const badgeClass = produto.quantidade < 5 ? 'badge-estoque-baixo' : 'bg-secondary';
                    produtoElement.innerHTML = `
                        <span class="produto-nome">${produto.descricao}</span>
                        <div class="acoes">
                            <span class="produto-quantidade badge ${badgeClass}">${produto.quantidade}</span>
                            <button class="btn btn-sm btn-outline-success aumentar" data-id="${produto.id}" 
                                    title="Aumentar quantidade" aria-label="Aumentar quantidade">
                                ➕
                            </button>
                            <button class="btn btn-sm btn-outline-danger diminuir" data-id="${produto.id}" 
                                    title="Diminuir quantidade" aria-label="Diminuir quantidade">
                                ➖
                            </button>
                            <button class="btn btn-sm btn-outline-warning editar" data-id="${produto.id}" 
                                    title="Editar produto" aria-label="Editar produto">
                                ✏️
                            </button>
                            <button class="btn btn-sm btn-outline-dark excluir" data-id="${produto.id}" 
                                    title="Excluir produto" aria-label="Excluir produto">
                                🗑️
                            </button>
                        </div>
                    `;
                    containerProdutos.appendChild(produtoElement);
                });
            }

            adicionarEventos();
        }

        // Adiciona eventos aos elementos
        function adicionarEventos() {
            // Busca de produtos
            document.getElementById('btnBusca')?.addEventListener('click', buscarProdutos);
            document.getElementById('inputBusca')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') buscarProdutos();
            });
            
            // Filtro de estoque
            document.getElementById('filtroEstoque')?.addEventListener('change', () => {
                buscarProdutos();
            });

            // Delegação de eventos para os botões de ação
            containerProdutos.addEventListener('click', async (e) => {
                const id = e.target.getAttribute('data-id');
                if (!id) return;

                if (e.target.classList.contains('aumentar')) {
                    await atualizarQuantidade(id, 1);
                } else if (e.target.classList.contains('diminuir')) {
                    await atualizarQuantidade(id, -1);
                } else if (e.target.classList.contains('editar')) {
                    await editarProdutoSeguro(id);
                } else if (e.target.classList.contains('excluir')) {
                    await excluirProduto(id);
                }
            });
        }

        // Busca avançada de produtos
        function buscarProdutos() {
            const termo = document.getElementById('inputBusca')?.value.toLowerCase() || '';
            const filtro = document.getElementById('filtroEstoque')?.value || 'todos';
            
            let resultados = produtos;
            
            // Filtro por termo
            if (termo) {
                resultados = resultados.filter(p => 
                    p.descricao.toLowerCase().includes(termo)
                );
            }
            
            // Filtros adicionais
            switch (filtro) {
                case 'estoque-baixo':
                    resultados = resultados.filter(p => p.quantidade < 5);
                    break;
                case 'recentes':
                    resultados.sort((a, b) => {
                        const dateA = a.ultimaAtualizacao?.toDate() || new Date(0);
                        const dateB = b.ultimaAtualizacao?.toDate() || new Date(0);
                        return dateB - dateA;
                    });
                    break;
            }
            
            renderizarProdutos(resultados);
        }

        // Funções CRUD
        async function salvarProduto() {
            if (!validarFormulario()) return;

            const descricao = inputDescricao.value.trim();
            const quantidade = parseInt(inputQuantidade.value);

            try {
                btnSalvarTexto.textContent = "Salvando...";
                btnSalvarSpinner.classList.remove('d-none');
                btnSalvar.disabled = true;

                const produtoData = {
                    descricao,
                    quantidade,
                    ultimaAtualizacao: serverTimestamp()
                };

                if (produtoEditando) {
                    // Atualizar produto existente
                    await updateDoc(doc(db, "produtos", produtoEditando), produtoData);
                    notificar("Produto atualizado com sucesso!", "success");
                } else {
                    // Adicionar novo produto
                    await addDoc(produtosCollection, produtoData);
                    notificar("Produto adicionado com sucesso!", "success");
                }

                modal.hide();
                formProduto.reset();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                notificar("Erro ao salvar produto. Tente novamente.", "error");
            } finally {
                btnSalvarTexto.textContent = "Salvar";
                btnSalvarSpinner.classList.add('d-none');
                btnSalvar.disabled = false;
                produtoEditando = null;
            }
        }

        // Controle de concorrência para edição
        async function editarProdutoSeguro(id) {
            if (edicoesPendentes.has(id)) {
                notificar("Este produto já está sendo editado", "warning");
                return;
            }

            edicoesPendentes.add(id);
            try {
                await editarProduto(id);
            } finally {
                edicoesPendentes.delete(id);
            }
        }

        async function editarProduto(id) {
            const produto = produtos.find(p => p.id === id);
            if (produto) {
                inputDescricao.value = produto.descricao;
                inputQuantidade.value = produto.quantidade;
                produtoEditando = id;
                document.getElementById('produtoModalLabel').textContent = "Editar Produto";
                modal.show();
            }
        }

        async function excluirProduto(id) {
            if (confirm("Tem certeza que deseja excluir este produto permanentemente?")) {
                try {
                    toggleLoading(true);
                    await deleteDoc(doc(db, "produtos", id));
                    notificar("Produto excluído com sucesso!", "success");
                } catch (error) {
                    console.error("Erro ao excluir:", error);
                    notificar("Erro ao excluir produto.", "error");
                } finally {
                    toggleLoading(false);
                }
            }
        }

        async function atualizarQuantidade(id, valor) {
            const produto = produtos.find(p => p.id === id);
            if (produto) {
                const novaQuantidade = produto.quantidade + valor;
                if (novaQuantidade >= 0) {
                    try {
                        toggleLoading(true);
                        await updateDoc(doc(db, "produtos", id), {
                            quantidade: novaQuantidade,
                            ultimaAtualizacao: serverTimestamp()
                        });
                    } catch (error) {
                        console.error("Erro ao atualizar:", error);
                        notificar("Erro ao atualizar quantidade.", "error");
                    } finally {
                        toggleLoading(false);
                    }
                } else {
                    notificar("Quantidade não pode ser negativa!", "warning");
                }
            }
        }

        // Event Listeners
        btnSalvar.addEventListener('click', salvarProduto);
        document.getElementById('produtoModal').addEventListener('hidden.bs.modal', () => {
            formProduto.reset();
            produtoEditando = null;
            document.getElementById('produtoModalLabel').textContent = "Cadastro de Produto";
            // Remove classes de validação
            inputDescricao.classList.remove('is-invalid');
            inputQuantidade.classList.remove('is-invalid');
        });

        // Validação em tempo real
        inputDescricao?.addEventListener('input', () => {
            if (inputDescricao.value.trim().length >= 3) {
                inputDescricao.classList.remove('is-invalid');
            }
        });
        
        inputQuantidade?.addEventListener('input', () => {
            if (!isNaN(inputQuantidade.value) && parseInt(inputQuantidade.value) >= 0) {
                inputQuantidade.classList.remove('is-invalid');
            }
        });

        // Inicialização
        document.addEventListener('DOMContentLoaded', iniciarMonitoramento);
    </script>
</body>
</html>
